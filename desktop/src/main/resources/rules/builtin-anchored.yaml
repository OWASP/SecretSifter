    name: 'OAuth Credential Pair in btoa() Call'
    key: 'btoa_oauth_creds'
    kind: anchored
    severity: HIGH
    pattern: '\bbtoa\(\s*(?:"[A-Za-z0-9\-_.+/@]{3,200}:[A-Za-z0-9\-_.+/!#$%^&*@]{8,200}"|''[A-Za-z0-9\-_.+/@]{3,200}:[A-Za-z0-9\-_.+/!#$%^&*@]{8,200}''|`[A-Za-z0-9\-_.+/@]{3,200}:[A-Za-z0-9\-_.+/!#$%^&*@]{8,200}`)\s*\)'
